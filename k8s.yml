apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-upload
spec:
  replicas: 1
  selector:
    matchLabels:
      app: image-upload
  template:
    metadata:
      labels:
        app: image-upload
    spec:
      containers:
        - name: image-upload
          image: your-registry/image-upload:latest
          ports:
            - containerPort: 8080
          env:
            - name: IMAGE_STORE_CAPACITY_BYTES
              value: "52428800"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: image-upload
spec:
  selector:
    app: image-upload
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: image-upload
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: image-upload
  minReplicas: 1
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 65
